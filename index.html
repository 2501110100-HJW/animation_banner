<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRAW BERRY Landing Banner</title>
  <style>
    :root {
      --title-red: #ED1866;
      --bg: #F9F8F4;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      font-family: "Didot", "Bodoni 72", "Bodoni MT", "Libre Bodoni", Georgia, serif;
    }

    .page {
      width: 100vw;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
    }

    .hero {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
    }

    .hero-svg {
      width: 100vw;
      height: 100vh;
      display: block;
      background: var(--bg);
    }

    .asterisk {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinSlow 9s linear infinite;
    }

    .title-group {
      opacity: 0;
      transform: translateY(28px);
    }

    .hero.is-loaded .title-group {
      animation: titleIn .9s cubic-bezier(.2, .9, .2, 1) both .15s;
    }

    .hero-title {
      font-family: "Didot", "Bodoni 72", "Bodoni MT", "Libre Bodoni", Georgia, serif;
      font-size: 400px;
      font-weight: 500;
      letter-spacing: -22px;
      dominant-baseline: alphabetic;
    }

    .title-red { fill: var(--title-red); }
    .title-white { fill: #fff; }

    .fruit,
    .mask-fruit {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .fruit {
      filter: drop-shadow(26px 28px 28px rgba(50, 20, 20, .15));
    }

    .hero.is-loaded .fruit--top-whole,
    .hero.is-loaded .mask-fruit--top-whole {
      animation: berryDrop 1.05s cubic-bezier(.17, .84, .28, 1.08) both 1.05s;
    }

    .hero.is-loaded .fruit--top-slice,
    .hero.is-loaded .mask-fruit--top-slice {
      animation: berryDropAlt 1.05s cubic-bezier(.17, .84, .28, 1.08) both 1.42s;
    }

    .hero.is-loaded .fruit--large,
    .hero.is-loaded .mask-fruit--large {
      animation: berryDropLarge 1.1s cubic-bezier(.17, .84, .28, 1.08) both 1.78s;
    }

    .hero.is-loaded .fruit--bottom-slice,
    .hero.is-loaded .mask-fruit--bottom-slice {
      animation: berryDropBottom 1.05s cubic-bezier(.17, .84, .28, 1.08) both 2.14s;
    }

    @keyframes titleIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes berryDrop {
      0% { opacity: 0; transform: translateY(-1400px) rotate(-18deg) scale(.94); }
      74% { opacity: 1; transform: translateY(18px) rotate(3deg) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes berryDropAlt {
      0% { opacity: 0; transform: translateY(-1400px) rotate(16deg) scale(.94); }
      76% { opacity: 1; transform: translateY(18px) rotate(-4deg) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes berryDropLarge {
      0% { opacity: 0; transform: translateY(-1400px) rotate(10deg) scale(.95); }
      78% { opacity: 1; transform: translateY(20px) rotate(-2deg) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes berryDropBottom {
      0% { opacity: 0; transform: translateY(-1400px) rotate(-12deg) scale(.96); }
      75% { opacity: 1; transform: translateY(16px) rotate(3deg) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .asterisk,
      .hero.is-loaded .title-group,
      .hero.is-loaded .fruit,
      .hero.is-loaded .mask-fruit {
        animation: none !important;
      }

      .title-group,
      .fruit,
      .mask-fruit {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Strawberry winter new menu landing banner">
      <svg class="hero-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="heroTitle">
        <title id="heroTitle">STRAW BERRY landing banner</title>

        <defs>
          <mask id="fruitTextMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080" style="mask-type: alpha;">
            <rect x="0" y="0" width="1920" height="1080" fill="transparent" />
            <image class="mask-fruit mask-fruit--top-whole" href="assets/strawberry-top-whole.png" x="660" y="86" width="526" height="526" />
            <image class="mask-fruit mask-fruit--top-slice" href="assets/strawberry-top-slice.png" x="1329" y="-140" width="520" height="520" />
            <image class="mask-fruit mask-fruit--large" href="assets/strawberry-large-right.png" x="1110" y="249" width="732" height="732" />
            <image class="mask-fruit mask-fruit--bottom-slice" href="assets/strawberry-bottom-slice.png" x="499" y="649" width="561" height="561" />
          </mask>
        </defs>

        <rect width="1920" height="1080" fill="#F9F8F4" />

        <image class="asterisk" href="assets/asterisk.png" x="80" y="100" width="119" height="122" />

        <!-- 1. 기본 빨간색 텍스트 -->
        <g class="title-group" transform="translate(80 380) scale(1 1.3)">
          <text class="hero-title title-red">
            <tspan x="64" y="588">BERRY</tspan>
            <tspan x="64" y="900">SWEET.</tspan>
          </text>
        </g>

        <!-- 2. 딸기 이미지 레이어 -->
        <image class="fruit fruit--top-whole" href="assets/strawberry-top-whole.png" x="660" y="86" width="526" height="526" />
        <image class="fruit fruit--top-slice" href="assets/strawberry-top-slice.png" x="1329" y="-140" width="520" height="520" />
        <image class="fruit fruit--large" href="assets/strawberry-large-right.png" x="1110" y="249" width="732" height="732" />
        <image class="fruit fruit--bottom-slice" href="assets/strawberry-bottom-slice.png" x="499" y="649" width="561" height="561" />

        <!-- 3. 딸기와 겹치는 영역에서만 보이는 흰색 텍스트 -->
        <g class="title-group" transform="translate(80 380) scale(1 1.3)" mask="url(#fruitTextMask)">
          <text class="hero-title title-white">
            <tspan x="64" y="588">BERRY</tspan>
            <tspan x="64" y="900">SWEET.</tspan>
          </text>
        </g>
      </svg>
    </section>
  </main>

  <script>
    const hero = document.querySelector('.hero');

    window.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => hero.classList.add('is-loaded'));
    });

    // 클릭하면 배너 애니메이션을 다시 재생합니다.
    hero.addEventListener('click', () => {
      hero.classList.remove('is-loaded');
      void hero.offsetWidth;
      hero.classList.add('is-loaded');
    });
  </script>
</body>
</html>
